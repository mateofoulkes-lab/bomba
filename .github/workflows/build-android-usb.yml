name: Build Android USB Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '0.png'
      - '1.png'
      - '2.png'
      - '3.png'
      - '4.png'
      - '5.png'
      - '6.png'
      - '7.png'
      - '8.png'
      - '9.png'
      - '.github/workflows/build-android-usb.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare symbol assets
        working-directory: .
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/final/symbols
          missing=0
          for n in {0..9}; do
            if [ -f "$n.png" ]; then
              cp "$n.png" "android/app/src/main/assets/final/symbols/$n.png"
            else
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            git fetch origin main --depth=1
            for n in {0..9}; do
              if [ ! -f "android/app/src/main/assets/final/symbols/$n.png" ]; then
                git show "origin/main:$n.png" > "android/app/src/main/assets/final/symbols/$n.png"
              fi
            done
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bomba-usb-bridge-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
