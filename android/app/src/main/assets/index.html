<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bomba USB Bridge</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font-family:system-ui,sans-serif}main{width:min(92vw,520px);padding:24px;border:1px solid #555;border-radius:14px;background:#1c1c1c}h1{margin:0 0 8px;font-size:1.4rem}p{opacity:.8}.status,.data{padding:12px;margin:12px 0;border:1px solid #555;border-radius:8px;font-family:monospace;white-space:pre-wrap;min-height:46px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:54px;font-size:1rem;font-weight:700;border-radius:9px;border:1px solid #777}#connect{grid-column:1/-1;background:#eee;color:#111}.small{font-size:.82rem;opacity:.65;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Nano · puente USB</h1>
<p>Prueba nativa Android → OTG → Arduino Nano.</p>
<div id="status" class="status">SIN CONECTAR</div>
<div id="data" class="data">Sin datos del Nano.</div>
<div class="grid">
<button id="connect">CONECTAR NANO</button>
<button data-cmd="INICIAR">INICIAR</button>
<button data-cmd="PAUSA">PAUSA</button>
<button data-cmd="RESET">RESET 90:45</button>
<button data-cmd="ESTADO">PEDIR ESTADO</button>
</div>
<div class="small">La app usa USB nativo de Android; no depende de Web Serial de Chrome.</div>
</main>
<script>
const statusEl=document.getElementById('status');
const dataEl=document.getElementById('data');
window.usbBridgeStatus=(s)=>statusEl.textContent=s;
window.usbBridgeData=(d)=>dataEl.textContent=d;
document.getElementById('connect').onclick=()=>{
  if(window.AndroidUsb) AndroidUsb.connect();
  else statusEl.textContent='PUENTE ANDROID NO DISPONIBLE';
};
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{
  if(window.AndroidUsb) AndroidUsb.send(b.dataset.cmd);
});
</script>
</body>
</html>
